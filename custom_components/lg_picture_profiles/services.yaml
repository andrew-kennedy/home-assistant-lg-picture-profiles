import_profiles:
  name: Import standard profiles
  description: Validate and import a profile collection into the TV, replacing its standards and queuing verified restoration. A new collection starts with management enabled.
  fields:
    entry_id:
      name: Integration entry ID
      description: Optional when only one TV is configured.
      selector:
        text:
    document:
      name: Profile document
      description: Supply a structured document or YAML text, not both.
      selector:
        object:
    yaml:
      name: YAML document
      selector:
        text:
          multiline: true
export_profiles:
  name: Export standard profiles
  description: Return JSON and readable YAML for backup or Git. Temporary adjustments are excluded.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
restore_standard:
  name: Restore standard
  description: Restore saved values for the selected scope using the current day/night settings. Requires an available bridge; native standby restores remain queued on the TV.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
    scope:
      name: Scope
      default: all
      selector:
        select:
          options: [all, active]
save_standard:
  name: Save adjustments as standard
  description: Ask the TV to promote tracked temporary adjustments to its saved standard.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
    scope:
      name: Scope
      default: active
      selector:
        select:
          options: [active, all]
reconcile:
  name: Update picture environment
  description: Ask the TV to retry pending session restores and changed room values.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
preview:
  name: Preview differences
  description: Show a compact status summary and tracked temporary changes compared with the effective standards. Uses the saved snapshot while offline; it does not audit every native TV setting. Use Export standard profiles or Export complete profile backup for full data.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:

export_backup:
  name: Export complete profile backup
  description: Return the verified complete TV snapshot stored in Home Assistant, including temporary adjustments and recovery scopes.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
    previous:
      name: Previous standard revision
      description: Zero returns the latest backup; 1–5 returns an earlier saved standard revision when available.
      default: 0
      selector:
        number:
          min: 0
          max: 5
          step: 1
restore_backup:
  name: Restore complete profile backup
  description: Restore TV standards and preferences from a verified complete snapshot. Historical temporary values are kept in the file, not replayed.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
    backup:
      name: Backup envelope
      required: true
      selector:
        object:
