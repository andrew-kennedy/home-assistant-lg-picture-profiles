import_profiles:
  name: Import standard profiles
  description: Validate and import a profile collection into the TV, replacing its standards and queuing verified restoration. A new collection starts with management enabled.
  fields:
    entry_id:
      name: Integration entry ID
      description: Optional when only one TV is configured.
      selector:
        text:
    document:
      name: Profile document
      description: Supply a structured document or YAML text, not both.
      selector:
        object:
    yaml:
      name: YAML document
      selector:
        text:
          multiline: true
export_profiles:
  name: Export standard profiles
  description: Return JSON and readable YAML for backup or Git. Temporary adjustments are excluded.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
restore_standard:
  name: Restore standard
  description: Restore saved values for the selected scope using the active named profile. Requires an available bridge; native standby restores remain queued on the TV.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
    scope:
      name: Scope
      default: all
      selector:
        select:
          options: [all, active]
    filters:
      name: Profile filters
      description: >-
        Optional editor filters. Each value is a list, for example {port: [hdmi1, hdmi4], format: [hdr], family: [game]}.
        Also supports preset, genre and allm ("on" or "off"). Linked brightness includes every linked profile.
      selector:
        object:
    categories:
      name: Settings categories
      description: Optional categories to restore. Unavailable controls are excluded; the response lists exact restored targets. Requires bridge 0.16.0.
      selector:
        select:
          multiple: true
          options:
            - {value: picture, label: Picture}
            - {value: motion, label: Motion}
            - {value: game, label: Gaming}
            - {value: port, label: HDMI connection}
            - {value: selection, label: Preset selection}
save_standard:
  name: Save adjustments as standard
  description: Ask the TV to promote tracked temporary adjustments to the active profile’s saved standard.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
    scope:
      name: Scope
      default: active
      selector:
        select:
          options: [active, all]
reconcile:
  name: Update picture environment
  description: Ask the TV to retry pending session restores and changed room values.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
preview:
  name: Preview profiles
  description: Show the complete cached profile state, including standards, brightness preferences, temporary adjustments, recovery scopes and bridge status. Uses the saved snapshot with an offline status when the bridge is unavailable; it does not audit every native TV setting.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:

export_backup:
  name: Export complete profile backup
  description: Return the verified complete TV snapshot stored in Home Assistant, including temporary adjustments and recovery scopes.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
    previous:
      name: Previous standard revision
      description: Zero returns the latest backup; 1–5 returns an earlier saved standard revision when available.
      default: 0
      selector:
        number:
          min: 0
          max: 5
          step: 1
restore_backup:
  name: Restore complete profile backup
  description: Restore TV standards and preferences from a verified complete snapshot. Historical temporary values are kept in the file, not replayed.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
    backup:
      name: Backup envelope
      required: true
      selector:
        object:
apply_profile:
  name: Apply picture profile
  description: Select a TV-owned named profile using its stable ID. Use automatic to follow the TV's bright/dark bindings or standard for base values. Requires bridge 0.17.0. Selection persists across power cycles; standby application is queued on the TV.
  fields:
    entry_id:
      name: Integration entry ID
      description: Optional when only one TV is configured.
      selector:
        text:
    profile_id:
      name: Profile ID
      description: Copy the stable ID from Manage profiles in the editor. Renaming a profile keeps its ID.
      required: true
      example: p_a1b2c3d4
      selector:
        text:
    clear_adjustments:
      name: Clear temporary adjustments
      description: Apply saved standards now. Turn off to preserve current temporary adjustments until the next power cycle.
      default: true
      selector:
        boolean:
